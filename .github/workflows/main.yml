name: ci

on:
  push:
    branches:
      - main
      - dev
      - fix/*
      - feat/*
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Check Types
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm test
